<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美国留学申请记录</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#eef1f5;--card:#fff;--border:#e5e7eb;--text:#1f2937;--muted:#6b7280}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px}
.wrap{max-width:1280px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px}
header h1{font-size:22px;font-weight:700}
.subtitle{color:var(--muted);font-size:13px;margin-top:4px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;border:none;cursor:pointer;border-radius:8px;padding:8px 12px;background:#fff;border:1px solid var(--border);color:var(--text);transition:.15s;user-select:none}
button:hover{background:#f3f4f6}
button.danger:hover{background:#fee2e2;border-color:#fca5a5;color:#b91c1c}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 16px;font-size:13px;color:var(--muted)}
.stat b{font-size:20px;color:var(--text);margin-right:2px}
.stat.region{background:#111827;color:#fff;border-color:#111827;font-weight:700}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
@media(max-width:900px){.board{grid-template-columns:1fr}}
.column{background:#fff;border-radius:14px;border:1px solid var(--border);padding:12px;min-height:200px;display:flex;flex-direction:column}
.column.reach{border-top:4px solid #e11d48}
.column.match{border-top:4px solid #2563eb}
.column.safety{border-top:4px solid #16a34a}
.column-header{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 12px;border-bottom:2px solid #f1f3f5}
.column-header .title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.reach .dot{background:#e11d48}
.match .dot{background:#2563eb}
.safety .dot{background:#16a34a}
.column-header .count{font-size:12px;color:var(--muted);background:#f3f4f6;border-radius:999px;padding:2px 10px}
.schools{display:flex;flex-direction:column;gap:10px;margin-top:12px;min-height:60px;flex:1}
.schools.drag-over{outline:2px dashed #6366f1;outline-offset:4px;border-radius:10px}
.school-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:.15s}
.school-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08)}
.school-card.dragging{opacity:.4}
.school-card.drag-over{border:2px dashed #6366f1}
.school-head{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.drag-handle{cursor:grab;color:#cbd5e1;user-select:none;font-size:14px}
.school-name{flex:1;font-size:15px;font-weight:600;border:none;border-bottom:1px dashed transparent;padding:6px 4px;background:transparent;outline:none;min-width:0}
.school-name:focus{border-bottom-color:#6366f1}
.icon-btn{background:transparent;border:none;cursor:pointer;color:var(--muted);font-size:16px;padding:4px 6px;border-radius:6px;line-height:1}
.icon-btn:hover{background:#f3f4f6;color:#111827}
.school-meta{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.school-meta label{font-size:12px;color:var(--muted);white-space:nowrap}
select.status{flex:1;border:1px solid var(--border);border-radius:8px;padding:6px;font:inherit;font-size:13px;background:#fff;min-width:0}
.move-select{font-size:12px;border:1px solid var(--border);border-radius:8px;padding:5px;color:var(--muted);background:#fff;max-width:86px}
.info-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.info-item{display:flex;gap:6px;align-items:center}
.info-key{width:38%;border:1px solid var(--border);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;background:#fafafa;min-width:0}
.info-value{flex:1;border:1px solid var(--border);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;min-width:0}
.info-key:focus,.info-value:focus,.status:focus,.move-select:focus{outline:2px solid #6366f1;outline-offset:-1px}
.add-info{width:100%;background:transparent;border:1px dashed var(--border);color:var(--muted);padding:6px;border-radius:8px;font-size:13px}
.add-info:hover{background:#f9fafb;color:#111827}
.add-school{width:100%;margin-top:10px;background:transparent;border:1px dashed var(--border);color:var(--muted);padding:10px;border-radius:10px;font-size:14px}
.add-school:hover{background:#f9fafb;color:#111827;border-color:#c7cbd1}
.empty{color:#9ca3af;font-size:13px;text-align:center;padding:14px 0}
.uni-picker{position:absolute;z-index:1000;background:#fff;border:1px solid #d1d5db;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:none;overflow:hidden;max-width:calc(100vw - 32px)}
.uni-picker.open{display:block}
.uni-picker-search{display:flex;gap:6px;padding:8px;border-bottom:1px solid #f1f3f5}
.uni-picker-search input{flex:1;border:1px solid var(--border);border-radius:8px;padding:8px;font:inherit;font-size:13px;outline:none;min-width:0}
.uni-picker-search input:focus{outline:2px solid #6366f1;outline-offset:-1px}
.uni-picker-close{background:transparent;border:none;cursor:pointer;color:var(--muted);font-size:16px;padding:0 10px;border-radius:6px}
.uni-picker-close:hover{background:#f3f4f6}
.uni-picker-list{max-height:320px;overflow-y:auto}
.uni-item{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid #f7f8fa}
.uni-item:hover{background:#f3f4f6}
.uni-item .uni-rank{width:26px;height:26px;flex:none;display:inline-flex;align-items:center;justify-content:center;background:#111827;color:#fff;border-radius:6px;font-size:11px;font-weight:600}
.uni-item .uni-name{flex:1;color:#1f2937;font-weight:500;min-width:0}
.uni-item .uni-zh{color:var(--muted);font-size:12px;flex:none}
.uni-picker-empty{padding:16px;text-align:center;color:var(--muted);font-size:13px}
.uni-picker-tabs{display:flex;gap:4px;padding:8px 8px 0}
.uni-picker-tabs button{flex:1;border:none;background:#f3f4f6;padding:6px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--muted)}
.uni-picker-tabs button.active{background:#111827;color:#fff}
.head-left{display:flex;flex-direction:column;gap:10px}
.region-switch{display:inline-flex;gap:6px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:4px}
.region-switch button{border:none;background:transparent;padding:6px 14px;border-radius:7px;font-size:13px;color:var(--muted);cursor:pointer}
.region-switch button.active{background:#111827;color:#fff}
.sync-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:8px 10px;background:#fff;border:1px solid var(--border);border-radius:8px}
.sync-status::before{content:'';width:8px;height:8px;border-radius:50%;background:#9ca3af}
.sync-status.online::before{background:#16a34a}.sync-status.syncing::before{background:#f59e0b}.sync-status.error::before{background:#dc2626}
</style>
</head>
<body>
<div class="wrap">
<header>
    <div class="head-left">
      <h1>🎓 留学申请记录</h1>
      <div class="region-switch" id="regionSwitch">
        <button data-region="us" class="active">🇺🇸 美国</button>
        <button data-region="uk">🇬🇧 英国</button>
        <button data-region="sg">🇸🇬 新加坡</button>
      </div>
    </div>
    <div class="toolbar">
      <span class="sync-status" id="syncStatus">本机保存</span>
      <button id="saveBtn">💾 立即保存</button>
      <button id="exportBtn">⬇️ 导出数据</button>
      <button id="importBtn">⬆️ 导入数据</button>
      <button id="resetBtn" class="danger">🗑️ 清空全部</button>
    </div>
  </header>
<div class="stats" id="stats"></div>
  <main class="board">
    <section class="column reach" data-category="reach">
      <div class="column-header">
        <div class="title"><span class="dot"></span>冲刺 Reach</div>
        <span class="count" id="count-reach">0 所</span>
      </div>
      <div class="schools" id="schools-reach"></div>
      <button class="add-school" data-add="reach">＋ 添加学校</button>
    </section>
    <section class="column match" data-category="match">
      <div class="column-header">
        <div class="title"><span class="dot"></span>稳妥 Match</div>
        <span class="count" id="count-match">0 所</span>
      </div>
      <div class="schools" id="schools-match"></div>
      <button class="add-school" data-add="match">＋ 添加学校</button>
    </section>
    <section class="column safety" data-category="safety">
      <div class="column-header">
        <div class="title"><span class="dot"></span>保底 Safety</div>
        <span class="count" id="count-safety">0 所</span>
      </div>
      <div class="schools" id="schools-safety"></div>
      <button class="add-school" data-add="safety">＋ 添加学校</button>
    </section>
  </main>
</div>
<input type="file" id="fileInput" accept="application/json" hidden>
<script src="config.js"></script>

let currentRegion = 'us';
try { const r = localStorage.getItem('us_apply_region'); if (REGIONS[r]) currentRegion = r; } catch (e) {}

function defaultState() {
  return {
    us: { reach: [], match: [], safety: [] },
    uk: { reach: [], match: [], safety: [] },
    sg: { reach: [], match: [], safety: [] }
  };
}

function normalize(d) {
  const base = defaultState();
  if (!d || typeof d !== 'object') return base;
  // 旧格式迁移：顶层直接是 reach/match/safety（视为美国）
  if (Array.isArray(d.reach) || Array.isArray(d.match) || Array.isArray(d.safety)) {
    base.us.reach = d.reach || [];
    base.us.match = d.match || [];
    base.us.safety = d.safety || [];
    return base;
  }
  Object.keys(base).forEach(r => {
    if (d[r] && typeof d[r] === 'object') {
      base[r].reach = d[r].reach || [];
      base[r].match = d[r].match || [];
      base[r].safety = d[r].safety || [];
    }
  });
  return base;
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return normalize(JSON.parse(raw));
  } catch (e) {}
  return defaultState();
}

let state = defaultState();

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

// ===== Supabase 云端同步（填好下面两项即可开启多人实时共享）=====
const SUPABASE_URL = (window.APP_CONFIG && window.APP_CONFIG.supabaseUrl) || '';
const SUPABASE_ANON_KEY = (window.APP_CONFIG && window.APP_CONFIG.supabaseAnonKey) || '';
const SUPABASE_ON = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
let supabase = null;

function setSyncStatus(text, type) {
  const el = document.getElementById('syncStatus');
  el.textContent = text;
  el.className = 'sync-status' + (type ? ' ' + type : '');
}

function loadSupabaseLib() {
  const sources = [
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
    'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'
  ];
  return new Promise(resolve => {
    if (window.supabase) return resolve(true);
    const trySource = index => {
      if (index >= sources.length) return resolve(false);
      const s = document.createElement('script');
      let finished = false;
      const done = ok => {
        if (finished) return;
        finished = true;
        clearTimeout(timer);
        if (ok && window.supabase) resolve(true);
        else { s.remove(); trySource(index + 1); }
      };
      const timer = setTimeout(() => done(false), 8000);
      s.src = sources[index];
      s.onload = () => done(true);
      s.onerror = () => done(false);
      document.head.appendChild(s);
    };
    trySource(0);
  });
}

function sbRow(s, region, cat, pos) {
  return { id: s.id, region: region, category: cat, name: s.name, status: s.status, info: s.info, position: pos };
}

function sbUpsert(s, region, cat) {
  if (!supabase) return;
  const pos = state[region][cat].indexOf(s);
  setSyncStatus('正在保存…', 'syncing');
  supabase.from('schools').upsert(sbRow(s, region, cat, pos)).then(({ error }) => {
    setSyncStatus(error ? '云端保存失败' : '已保存到云端', error ? 'error' : 'online');
  });
}

let sbTimers = {};
function scheduleUpsert(s, region, cat) {
  if (!supabase) return;
  clearTimeout(sbTimers[s.id]);
  setSyncStatus('正在保存…', 'syncing');
  sbTimers[s.id] = setTimeout(() => {
    const pos = state[region][cat].indexOf(s);
    supabase.from('schools').upsert(sbRow(s, region, cat, pos)).then(({ error }) => {
      setSyncStatus(error ? '云端保存失败' : '已保存到云端', error ? 'error' : 'online');
    });
  }, 400);
}

async function sbDelete(id) {
  if (!supabase) return;
  await supabase.from('schools').delete().eq('id', id);
}

async function persistRegion(region) {
  if (!supabase) return;
  const rows = [];
  CATEGORIES.forEach(cat => {
    state[region][cat].forEach((s, idx) => rows.push(sbRow(s, region, cat, idx)));
  });
  if (!rows.length) return;
  setSyncStatus('正在保存…', 'syncing');
  const { error } = await supabase.from('schools').upsert(rows);
  setSyncStatus(error ? '云端保存失败' : '已保存到云端', error ? 'error' : 'online');
}

function applyRows(rows) {
  const next = defaultState();
  (rows || []).forEach(r => {
    if (next[r.region] && next[r.region][r.category]) {
      next[r.region][r.category].push({ id: r.id, name: r.name, status: r.status, info: r.info || [] });
    }
  });
  state = next;
  save();
}

async function refreshFromServer() {
  if (!supabase) return;
  const active = document.activeElement;
  if (active && active.closest && active.closest('.school-card')) return;
  const { data, error } = await supabase.from('schools').select('*').order('position');
  if (error || !data) { setSyncStatus('云端连接失败', 'error'); return; }
  applyRows(data);
  setSyncStatus('已保存到云端', 'online');
  render();
}

function subscribeRealtime() {
  if (!supabase) return;
  supabase.channel('schools-rt')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'schools' }, () => refreshFromServer())
    .subscribe();
}

async function replaceAllFromState() {
  if (!supabase) return;
  await supabase.from('schools').delete().neq('id', '');
  const rows = [];
  Object.keys(REGIONS).forEach(r => {
    CATEGORIES.forEach(cat => {
      state[r][cat].forEach((s, idx) => rows.push(sbRow(s, r, cat, idx)));
    });
  });
  await supabase.from('schools').upsert(rows);
}

async function saveAllNow() {
  save();
  if (!supabase) {
    setSyncStatus('仅保存到本机', 'error');
    alert('数据已保存到当前浏览器，但云端没有连接成功。请检查网络后刷新页面。');
    return;
  }
  setSyncStatus('正在保存…', 'syncing');
  const rows = [];
  Object.keys(REGIONS).forEach(r => CATEGORIES.forEach(cat => {
    state[r][cat].forEach((s, idx) => rows.push(sbRow(s, r, cat, idx)));
  }));
  if (!rows.length) {
    setSyncStatus('没有需要保存的数据', 'online');
    return;
  }
  const { error } = await supabase.from('schools').upsert(rows);
  setSyncStatus(error ? '云端保存失败' : '已保存到云端', error ? 'error' : 'online');
  alert(error ? '云端保存失败：' + error.message : '保存成功，数据已写入云端。');
}

async function init() {
  setRegion(currentRegion);
  if (SUPABASE_ON) {
    setSyncStatus('正在连接云端…', 'syncing');
    await loadSupabaseLib();
    if (window.supabase) supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    if (supabase) {
      const { data, error } = await supabase.from('schools').select('*').order('position');
      if (!error && data) { applyRows(data); setSyncStatus('已连接，多人共享', 'online'); }
      else { state = load(); setSyncStatus('云端连接失败', 'error'); }
    } else {
      state = load();
      setSyncStatus('云端组件加载失败', 'error');
    }
  } else {
    state = load();
    setSyncStatus('本机保存（未配置云端）', '');
  }
  render();
  if (supabase) subscribeRealtime();
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function newSchool() {
  return {
    id: uid(),
    name: '',
    status: '未开始',
    info: DEFAULT_INFO.map(i => ({ id: uid(), key: i.key, value: i.value }))
  };
}

function newInfo() { return { id: uid(), key: '', value: '' }; }

function escapeAttr(str) {
  return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function board() { return state[currentRegion]; }

function findSchool(cat, id) { return board()[cat].find(s => s.id === id); }

function schoolHTML(cat, s) {
  const info = s.info.map(i =>
    '<div class="info-item" data-info-id="' + i.id + '">' +
      '<input class="info-key" data-field="info-key" placeholder="项目" value="' + escapeAttr(i.key) + '">' +
      '<input class="info-value" data-field="info-value" placeholder="内容" value="' + escapeAttr(i.value) + '">' +
      '<button class="icon-btn" data-action="del-info" title="删除信息">✕</button>' +
    '</div>'
  ).join('');

  const statusSel = STATUS_OPTIONS.map(o =>
    '<option value="' + o + '"' + (o === s.status ? ' selected' : '') + '>' + o + '</option>'
  ).join('');

  const moveSel = '<option value="">移动…</option>' + CATEGORIES.filter(c => c !== cat).map(c =>
    '<option value="' + c + '">' + CATEGORY_LABELS[c] + '</option>'
  ).join('');

  return '<div class="school-card" draggable="true" data-school-id="' + s.id + '">' +
    '<div class="school-head">' +
      '<span class="drag-handle" title="拖拽排序">⠿</span>' +
      '<input class="school-name" data-field="name" value="' + escapeAttr(s.name) + '" placeholder="学校名称（点击搜索院校）">' +
      '<button class="icon-btn" data-action="pick-school" title="搜索选择院校">🔍</button>' +
      '<button class="icon-btn" data-action="del-school" title="删除学校">🗑</button>' +
    '</div>' +
    '<div class="school-meta">' +
      '<label>申请状态</label>' +
      '<select class="status" data-field="status">' +
        '<option value="">— 未设置 —</option>' + statusSel +
      '</select>' +
      '<select class="move-select" data-action="move">' + moveSel + '</select>' +
    '</div>' +
    '<div class="info-list">' + info + '</div>' +
    '<button class="add-info" data-action="add-info">＋ 添加信息</button>' +
  '</div>';
}

function renderStats() {
  const b = board();
  const total = CATEGORIES.reduce((n, c) => n + b[c].length, 0);
  const submitted = CATEGORIES.reduce((n, c) => n + b[c].filter(s => ['已提交', '面试中', '已录取'].includes(s.status)).length, 0);
  document.getElementById('stats').innerHTML =
    '<div class="stat region">' + REGION_FLAGS[currentRegion] + ' ' + REGIONS[currentRegion] + '</div>' +
    '<div class="stat"><b>' + total + '</b> 所学校</div>' +
    '<div class="stat"><b>' + b.reach.length + '</b> 冲刺</div>' +
    '<div class="stat"><b>' + b.match.length + '</b> 稳妥</div>' +
    '<div class="stat"><b>' + b.safety.length + '</b> 保底</div>' +
    '<div class="stat"><b>' + submitted + '</b> 已提交/录取</div>';
}

function render() {
  const b = board();
  CATEGORIES.forEach(cat => {
    const list = document.getElementById('schools-' + cat);
    document.getElementById('count-' + cat).textContent = b[cat].length + ' 所';
    list.innerHTML = b[cat].length === 0
      ? '<div class="empty">还没有学校，点击下方「添加学校」</div>'
      : b[cat].map(s => schoolHTML(cat, s)).join('');
  });
  renderStats();
}
function addSchool(cat) {
  const s = newSchool();
  board()[cat].push(s);
  save();
  render();
  persistRegion(currentRegion);
}

function deleteSchool(cat, id) {
  const s = findSchool(cat, id);
  if (!confirm('确定删除「' + (s ? s.name : '') + '」吗？')) return;
  board()[cat] = board()[cat].filter(x => x.id !== id);
  save(); render();
  sbDelete(id);
  persistRegion(currentRegion);
}

function addInfo(cat, schoolId) {
  const s = findSchool(cat, schoolId);
  if (!s) return;
  s.info.push(newInfo());
  save(); render();
  sbUpsert(s, currentRegion, cat);
}

function deleteInfo(cat, schoolId, infoId) {
  const s = findSchool(cat, schoolId);
  if (!s) return;
  s.info = s.info.filter(i => i.id !== infoId);
  save(); render();
  sbUpsert(s, currentRegion, cat);
}

function moveSchool(from, id, to) {
  if (!CATEGORIES.includes(to) || from === to) return;
  const b = board();
  const idx = b[from].findIndex(s => s.id === id);
  if (idx === -1) return;
  const [school] = b[from].splice(idx, 1);
  b[to].push(school);
  save(); render();
  persistRegion(currentRegion);
}

// 点击：增删学校 / 增删信息
document.addEventListener('click', e => {
  const addBtn = e.target.closest('[data-add]');
  if (addBtn) { addSchool(addBtn.dataset.add); return; }

  const card = e.target.closest('.school-card');
  if (!card) return;
  const actionEl = e.target.closest('[data-action]');
  if (!actionEl) return;

  const cat = card.closest('.column').dataset.category;
  const schoolId = card.dataset.schoolId;
  const action = actionEl.dataset.action;

  if (action === 'del-school') deleteSchool(cat, schoolId);
  else if (action === 'pick-school') openPicker(card.querySelector('.school-name'));
  else if (action === 'add-info') addInfo(cat, schoolId);
  else if (action === 'del-info') {
    const item = actionEl.closest('.info-item');
    deleteInfo(cat, schoolId, item.dataset.infoId);
  }
});

// 输入：实时修改校名 / 状态 / 信息
document.addEventListener('input', e => {
  const el = e.target;
  const field = el.dataset.field;
  if (!field) return;
  const card = el.closest('.school-card');
  if (!card) return;
  const cat = card.closest('.column').dataset.category;
  const school = findSchool(cat, card.dataset.schoolId);
  if (!school) return;

  if (field === 'name') school.name = el.value;
  else if (field === 'status') school.status = el.value;
  else if (field === 'info-key' || field === 'info-value') {
    const item = el.closest('.info-item');
    const info = school.info.find(i => i.id === item.dataset.infoId);
    if (info) { if (field === 'info-key') info.key = el.value; else info.value = el.value; }
  }
  save();
  scheduleUpsert(school, currentRegion, cat);
  renderStats();
});

// 跨块移动
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.action === 'move') {
    const card = el.closest('.school-card');
    moveSchool(card.closest('.column').dataset.category, card.dataset.schoolId, el.value);
  }
});

// 拖拽排序 / 跨块移动
let dragData = null;
document.addEventListener('dragstart', e => {
  const card = e.target.closest('.school-card');
  if (!card) return;
  dragData = { cat: card.closest('.column').dataset.category, id: card.dataset.schoolId };
  card.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', card.dataset.schoolId); } catch (err) {}
});
document.addEventListener('dragend', () => {
  document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  dragData = null;
});
document.addEventListener('dragover', e => {
  if (!dragData) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  const targetCard = e.target.closest('.school-card');
  if (targetCard) targetCard.classList.add('drag-over');
  else {
    const col = e.target.closest('.column');
    if (col) col.querySelector('.schools').classList.add('drag-over');
  }
});
document.addEventListener('drop', e => {
  if (!dragData) return;
  e.preventDefault();
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  const { cat, id } = dragData;
  dragData = null;

  const srcIdx = board()[cat].findIndex(s => s.id === id);
  if (srcIdx === -1) return;

  const targetCard = e.target.closest('.school-card');
  let targetCat, targetIndex;
  if (targetCard) {
    targetCat = targetCard.closest('.column').dataset.category;
    targetIndex = board()[targetCat].findIndex(s => s.id === targetCard.dataset.schoolId);
  } else {
    const col = e.target.closest('.column');
    if (!col) return;
    targetCat = col.dataset.category;
    targetIndex = board()[targetCat].length;
  }

  const [school] = board()[cat].splice(srcIdx, 1);
  if (cat === targetCat && srcIdx < targetIndex) targetIndex--;
  board()[targetCat].splice(targetIndex, 0, school);
  save();
  render();
  persistRegion(currentRegion);
});

// 导出 / 导入 / 清空
document.getElementById('saveBtn').addEventListener('click', saveAllNow);

document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '留学申请记录.json';
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('importBtn').addEventListener('click', () => document.getElementById('fileInput').click());

document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      state = normalize(d);
      save();
      render();
      replaceAllFromState();
      alert('导入成功');
    } catch (err) {
      alert('导入失败：文件格式不正确');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('确定要清空全部记录吗？此操作不可恢复。')) return;
  state = defaultState();
  save();
  render();
  replaceAllFromState();
});

// ===== 院校搜索选择框 =====
function initPicker() {
  const p = document.createElement('div');
  p.className = 'uni-picker';
  p.innerHTML =
    '<div class="uni-picker-tabs">' +
      '<button data-region="us">🇺🇸 美国</button>' +
      '<button data-region="uk">🇬🇧 英国</button>' +
      '<button data-region="sg">🇸🇬 新加坡</button>' +
    '</div>' +
    '<div class="uni-picker-search">' +
      '<input type="text" placeholder="搜索院校名称（中文 / 英文）">' +
      '<button class="uni-picker-close" title="关闭">✕</button>' +
    '</div>' +
    '<div class="uni-picker-list"></div>';
  document.body.appendChild(p);
  return p;
}

const picker = initPicker();
const pickerSearch = picker.querySelector('.uni-picker-search input');
let pickerTarget = null;

function renderUniList(q) {
  const list = picker.querySelector('.uni-picker-list');
  const schools = SCHOOLS[currentRegion] || [];
  const query = (q || '').trim().toLowerCase();
  const items = schools.filter(s =>
    !query || s.en.toLowerCase().includes(query) || s.zh.includes(query)
  );
  if (!items.length) {
    list.innerHTML = '<div class="uni-picker-empty">没有匹配的院校，换个关键词试试</div>';
    return;
  }
  list.innerHTML = items.map(s =>
    '<div class="uni-item" data-en="' + escapeAttr(s.en) + '" data-zh="' + escapeAttr(s.zh) + '">' +
      '<span class="uni-name">' + s.zh + '</span>' +
      '<span class="uni-zh">' + s.en + '</span>' +
    '</div>'
  ).join('');
}

function openPicker(input) {
  pickerTarget = input;
  const rect = input.getBoundingClientRect();
  picker.style.top = (rect.bottom + window.scrollY + 6) + 'px';
  picker.style.left = (rect.left + window.scrollX) + 'px';
  picker.style.width = Math.max(340, rect.width) + 'px';
  picker.classList.add('open');
  pickerSearch.value = '';
  renderUniList('');
  setTimeout(() => pickerSearch.focus(), 0);
}

function closePicker() {
  picker.classList.remove('open');
  pickerTarget = null;
}

function setRegion(r) {
  if (!REGIONS[r]) return;
  currentRegion = r;
  try { localStorage.setItem('us_apply_region', r); } catch (e) {}
  document.querySelectorAll('[data-region]').forEach(b => {
    b.classList.toggle('active', b.dataset.region === r);
  });
  render();
  if (picker.classList.contains('open')) renderUniList(pickerSearch.value);
}

pickerSearch.addEventListener('input', () => renderUniList(pickerSearch.value.trim().toLowerCase()));

picker.querySelector('.uni-picker-close').addEventListener('click', closePicker);

picker.querySelector('.uni-picker-list').addEventListener('click', e => {
  const item = e.target.closest('.uni-item');
  if (!item || !pickerTarget) return;
  pickerTarget.value = item.dataset.zh;
  pickerTarget.dispatchEvent(new Event('input', { bubbles: true }));
  closePicker();
  pickerTarget.focus();
});

// 点击空的校名输入框时，自动弹出院校选择框
document.addEventListener('focusin', e => {
  if (e.target.dataset && e.target.dataset.field === 'name' && !e.target.value.trim()) {
    openPicker(e.target);
  }
});

// 地区切换
document.addEventListener('click', e => {
  const rb = e.target.closest('[data-region]');
  if (rb) { setRegion(rb.dataset.region); return; }
});

// 点击选择框外部时关闭
document.addEventListener('click', e => {
  if (!picker.classList.contains('open')) return;
  if (picker.contains(e.target)) return;
  const nameInput = e.target.closest && e.target.closest('[data-field="name"]');
  const pickBtn = e.target.closest && e.target.closest('[data-action="pick-school"]');
  if (nameInput || pickBtn) return;
  closePicker();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePicker();
});

init();
</script>
